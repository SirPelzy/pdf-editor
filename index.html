<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    /* ====== Reset & Variables ====== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #eef2f7; --surface: #ffffff; --text: #1e293b; --text-secondary: #64748b;
      --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #dbeafe;
      --toolbar-bg: #ffffff; --border: #e2e8f0; --shadow: 0 1px 3px rgba(0,0,0,.1);
      --page-shadow: 0 2px 12px rgba(0,0,0,.12); --radius: 8px; --danger: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --surface: #1e293b; --text: #e2e8f0; --text-secondary: #94a3b8;
      --primary: #3b82f6; --primary-hover: #60a5fa; --primary-light: #1e3a5f;
      --toolbar-bg: #1e293b; --border: #334155; --shadow: 0 1px 3px rgba(0,0,0,.4);
      --page-shadow: 0 2px 12px rgba(0,0,0,.4); --danger: #f87171;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ====== Toolbar ====== */
    #toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 12px; background: var(--toolbar-bg); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); z-index: 100; flex-wrap: wrap; }
    .tool-group { display: flex; align-items: center; gap: 4px; }
    .tool-sep { width: 1px; height: 24px; background: var(--border); margin: 0 6px; }
    .tool-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border: 1px solid transparent; border-radius: var(--radius); background: transparent; color: var(--text); font-size: 13px; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .tool-btn:hover { background: var(--primary-light); }
    .tool-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tool-btn:disabled { opacity: .4; cursor: not-allowed; }
    .tool-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .zoom-display { font-size: 13px; min-width: 48px; text-align: center; color: var(--text-secondary); font-weight: 500; }
    #colorPicker { width: 28px; height: 28px; border: 2px solid var(--border); border-radius: 50%; padding: 0; cursor: pointer; background: none; -webkit-appearance: none; }
    #colorPicker::-webkit-color-swatch-wrapper { padding: 2px; }
    #colorPicker::-webkit-color-swatch { border-radius: 50%; border: none; }
    select.tool-select { padding: 5px 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; cursor: pointer; }

    /* ====== Drop Zone ====== */
    #dropZone { flex: 1; display: flex; align-items: center; justify-content: center; }
    .drop-area { border: 3px dashed var(--border); border-radius: 16px; padding: 60px; text-align: center; transition: all .2s; cursor: pointer; max-width: 500px; }
    .drop-area:hover, .drop-area.drag-over { border-color: var(--primary); background: var(--primary-light); }
    .drop-icon { font-size: 56px; display: block; margin-bottom: 16px; }
    .drop-area h2 { font-size: 22px; margin-bottom: 8px; color: var(--text); }
    .drop-area p { color: var(--text-secondary); margin-bottom: 20px; font-size: 14px; }
    .browse-btn { padding: 10px 28px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; cursor: pointer; font-weight: 500; transition: background .15s; }
    .browse-btn:hover { background: var(--primary-hover); }

    /* ====== Viewport ====== */
    #viewport { flex: 1; overflow: auto; display: none; background: var(--bg); position: relative; }
    #pageContainer { position: relative; margin: 24px auto; box-shadow: var(--page-shadow); background: #fff; display: inline-block; }
    #viewport { text-align: center; }
    #pdfCanvas { display: block; }
    #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    #annotationLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    /* ====== Annotations ====== */
    .annotation { position: absolute; pointer-events: auto; }
    .text-annotation { min-width: 40px; min-height: 24px; cursor: move; user-select: none; }
    .text-annotation .text-content { padding: 4px 6px; border: 2px solid transparent; border-radius: 4px; outline: none; font-family: sans-serif; white-space: pre-wrap; word-break: break-word; background: transparent; min-width: 30px; min-height: 20px; cursor: move; user-select: none; }
    .text-annotation:hover .text-content, .text-annotation.selected .text-content { border-color: var(--primary); }
    .text-annotation.editing .text-content { border-color: var(--primary); background: rgba(255,255,255,.7); cursor: text; user-select: text; }
    .text-annotation.editing { cursor: text; }
    .annotation .delete-btn { position: absolute; top: -10px; right: -10px; width: 22px; height: 22px; border-radius: 50%; background: var(--danger); color: #fff; border: 2px solid #fff; font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 1; z-index: 10; }
    .annotation:hover .delete-btn { display: flex; }
    .sig-annotation { cursor: move; border: 2px solid transparent; border-radius: 4px; }
    .sig-annotation:hover, .sig-annotation.selected { border-color: var(--primary); }
    .sig-annotation img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; }
    .sig-annotation .resize-handle { position: absolute; width: 12px; height: 12px; background: var(--primary); border: 2px solid #fff; border-radius: 2px; display: none; }
    .sig-annotation:hover .resize-handle, .sig-annotation.selected .resize-handle { display: block; }
    .resize-handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }
    .resize-handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }

    /* ====== Page Navigator ====== */
    #pageNav { display: none; align-items: center; justify-content: center; gap: 12px; padding: 8px; background: var(--toolbar-bg); border-top: 1px solid var(--border); }
    #pageNav button { padding: 4px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; }
    #pageNav button:hover { background: var(--primary-light); }
    #pageNav button:disabled { opacity: .4; cursor: not-allowed; }
    #pageInput { width: 48px; text-align: center; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 13px; }
    #pageNav span { font-size: 13px; color: var(--text-secondary); }

    /* ====== Modal ====== */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--surface); border-radius: 12px; width: 480px; max-width: 95vw; max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { font-size: 18px; }
    .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); padding: 0 4px; }
    .modal-close:hover { color: var(--text); }
    .modal-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .modal-tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: none; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: all .15s; }
    .modal-tab:hover { color: var(--text); }
    .modal-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .modal-body { padding: 20px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    #signCanvas { width: 100%; height: 180px; border: 2px solid var(--border); border-radius: var(--radius); cursor: crosshair; touch-action: none; background: #fff; }
    [data-theme="dark"] #signCanvas { background: #f8f8f8; }
    .sign-actions { margin-top: 10px; text-align: right; }
    .sign-actions button { padding: 6px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; }
    .sign-actions button:hover { background: var(--primary-light); }
    #typeSignInput { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 16px; background: var(--surface); color: var(--text); margin-bottom: 12px; }
    #typeSignPreview { min-height: 80px; display: flex; align-items: center; justify-content: center; font-family: 'Dancing Script', cursive; font-size: 40px; color: #1a1a1a; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
    #uploadSignInput { margin-bottom: 12px; }
    #uploadSignPreview { min-height: 80px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
    #uploadSignPreview img { max-width: 100%; max-height: 120px; }
    #savedSignatures { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .saved-sig-item { border: 2px solid var(--border); border-radius: var(--radius); padding: 10px; cursor: pointer; text-align: center; background: #fff; transition: border-color .15s; position: relative; }
    .saved-sig-item:hover { border-color: var(--primary); }
    .saved-sig-item.selected { border-color: var(--primary); background: var(--primary-light); }
    .saved-sig-item img { max-width: 100%; max-height: 60px; }
    .saved-sig-item .remove-saved { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; border: none; font-size: 10px; cursor: pointer; display: none; align-items: center; justify-content: center; }
    .saved-sig-item:hover .remove-saved { display: flex; }
    .modal-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--border); }
    .modal-footer label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .modal-footer .btn-group { display: flex; gap: 8px; }
    .btn-cancel { padding: 8px 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; }
    .btn-apply { padding: 8px 20px; border: none; border-radius: var(--radius); background: var(--primary); color: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-apply:hover { background: var(--primary-hover); }
    .empty-state { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px; }

    /* ====== Toast ====== */
    #toastContainer { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 10px 20px; background: var(--surface); color: var(--text); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.2); font-size: 13px; animation: slideIn .3s ease; border-left: 4px solid var(--primary); }
    .toast.error { border-left-color: var(--danger); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ====== Cursors ====== */
    .cursor-text #annotationLayer { cursor: text; }
    .cursor-crosshair #annotationLayer { cursor: crosshair; }
    .cursor-pen #drawCanvas { cursor: crosshair; }
    .cursor-eraser #drawCanvas { cursor: cell; }
    .cursor-grab #annotationLayer { cursor: default; }

    /* ====== Responsive ====== */
    @media (max-width: 768px) {
      #toolbar { gap: 2px; padding: 4px 8px; }
      .tool-btn { padding: 5px 7px; font-size: 12px; }
      .tool-btn .btn-label { display: none; }
      .tool-sep { margin: 0 3px; }
    }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <div class="tool-group">
      <button class="tool-btn" id="openBtn" title="Open PDF (Ctrl+O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19V5a2 2 0 012-2h5l2 2h3a2 2 0 012 2v2"/><path d="M3 17l3.5-9h13L16 17H3z"/></svg>
        <span class="btn-label">Open</span>
      </button>
      <button class="tool-btn" id="saveBtn" disabled title="Save PDF (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span class="btn-label">Save</span>
      </button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn" id="zoomOutBtn" disabled title="Zoom Out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <span class="zoom-display" id="zoomDisplay">100%</span>
      <button class="tool-btn" id="zoomInBtn" disabled title="Zoom In">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn active" id="selectTool" disabled data-tool="select" title="Select (V)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
        <span class="btn-label">Select</span>
      </button>
      <button class="tool-btn" id="textTool" disabled data-tool="text" title="Text (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9.5" y1="20" x2="14.5" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        <span class="btn-label">Text</span>
      </button>
      <button class="tool-btn" id="signTool" disabled data-tool="signature" title="Signature (S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 19c-1.5 0-3-1-4.5-3s-3-2-4.5-1-3 3-5 3"/><path d="M3 17l4-4 3 3 6-6 5 5"/></svg>
        <span class="btn-label">Sign</span>
      </button>
      <button class="tool-btn" id="penTool" disabled data-tool="pen" title="Pen (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        <span class="btn-label">Pen</span>
      </button>
      <button class="tool-btn" id="highlightTool" disabled data-tool="highlight" title="Highlight (H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4"/></svg>
        <span class="btn-label">Highlight</span>
      </button>
      <button class="tool-btn" id="eraserTool" disabled data-tool="eraser" title="Eraser (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l9-9 8 8-4 5z"/><path d="M6 11l8 8"/></svg>
        <span class="btn-label">Eraser</span>
      </button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <input type="color" id="colorPicker" value="#000000" title="Color">
      <select class="tool-select" id="sizePicker" title="Size">
        <option value="1">1px</option>
        <option value="2">2px</option>
        <option value="3" selected>3px</option>
        <option value="5">5px</option>
        <option value="8">8px</option>
        <option value="12">12px</option>
      </select>
      <select class="tool-select" id="fontSizePicker" title="Font Size">
        <option value="8">8pt</option>
        <option value="10">10pt</option>
        <option value="12">12pt</option>
        <option value="14">14pt</option>
        <option value="16" selected>16pt</option>
        <option value="20">20pt</option>
        <option value="24">24pt</option>
        <option value="32">32pt</option>
        <option value="48">48pt</option>
      </select>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn" id="undoBtn" disabled title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-12.36L1 10"/></svg>
        <span class="btn-label">Undo</span>
      </button>
    </div>
    <div style="flex:1"></div>
    <div class="tool-group">
      <button class="tool-btn" id="themeBtn" title="Toggle Theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>

  <!-- Drop Zone -->
  <div id="dropZone">
    <div class="drop-area" id="dropArea">
      <span class="drop-icon">📄</span>
      <h2>Open a PDF</h2>
      <p>Drag & drop a PDF file here, or click to browse</p>
      <button class="browse-btn" id="browseBtn">Browse Files</button>
    </div>
  </div>

  <!-- Viewport -->
  <div id="viewport">
    <div id="pageContainer">
      <canvas id="pdfCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <div id="annotationLayer"></div>
    </div>
  </div>

  <!-- Page Navigator -->
  <div id="pageNav">
    <button id="prevPageBtn" disabled>◀ Prev</button>
    <span>Page <input id="pageInput" type="number" min="1" value="1"> of <span id="pageCount">0</span></span>
    <button id="nextPageBtn" disabled>Next ▶</button>
  </div>

  <!-- Signature Modal -->
  <div class="modal-backdrop" id="signModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Signature</h3>
        <button class="modal-close" id="signModalClose">&times;</button>
      </div>
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="draw">Draw</button>
        <button class="modal-tab" data-tab="type">Type</button>
        <button class="modal-tab" data-tab="upload">Upload</button>
        <button class="modal-tab" data-tab="saved">Saved</button>
      </div>
      <div class="modal-body">
        <div class="tab-panel active" id="drawPanel">
          <canvas id="signCanvas"></canvas>
          <div class="sign-actions"><button id="clearSignBtn">Clear</button></div>
        </div>
        <div class="tab-panel" id="typePanel">
          <input type="text" id="typeSignInput" placeholder="Type your name...">
          <div id="typeSignPreview"></div>
        </div>
        <div class="tab-panel" id="uploadPanel">
          <input type="file" id="uploadSignInput" accept="image/*">
          <div id="uploadSignPreview"></div>
        </div>
        <div class="tab-panel" id="savedPanel">
          <div id="savedSignatures"></div>
        </div>
      </div>
      <div class="modal-footer">
        <label><input type="checkbox" id="saveSignCheck" checked> Save for reuse</label>
        <div class="btn-group">
          <button class="btn-cancel" id="cancelSignBtn">Cancel</button>
          <button class="btn-apply" id="applySignBtn">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- Hidden File Input -->
  <input type="file" id="fileInput" accept=".pdf" style="display:none">

  <script>
  (function() {
    'use strict';

    // ===================== PDF.js Setup =====================
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ===================== State =====================
    const state = {
      pdfDoc: null,
      pdfBytes: null,
      fileName: '',
      currentPage: 1,
      totalPages: 0,
      scale: 1.5,
      activeTool: 'select',
      annotations: {},  // pageNum → { texts:[], signatures:[], drawings:[] }
      undoStack: [],
      savedSignatures: [],
      isDarkMode: false,
      isDrawing: false,
      currentStroke: null,
      pendingSignature: null,
      activeTextId: null,
      dragState: null,
      resizeState: null,
      pageWidth: 0,
      pageHeight: 0,
      rendering: false,
    };

    // Load saved signatures from localStorage
    try { state.savedSignatures = JSON.parse(localStorage.getItem('pdfEditorSigs') || '[]'); } catch(e) {}

    // ===================== DOM Refs =====================
    const $ = id => document.getElementById(id);
    const els = {
      toolbar: $('toolbar'), openBtn: $('openBtn'), saveBtn: $('saveBtn'),
      zoomInBtn: $('zoomInBtn'), zoomOutBtn: $('zoomOutBtn'), zoomDisplay: $('zoomDisplay'),
      selectTool: $('selectTool'), textTool: $('textTool'), signTool: $('signTool'),
      penTool: $('penTool'), highlightTool: $('highlightTool'), eraserTool: $('eraserTool'),
      colorPicker: $('colorPicker'), sizePicker: $('sizePicker'), fontSizePicker: $('fontSizePicker'),
      undoBtn: $('undoBtn'), themeBtn: $('themeBtn'), themeIcon: $('themeIcon'),
      dropZone: $('dropZone'), dropArea: $('dropArea'), browseBtn: $('browseBtn'),
      viewport: $('viewport'), pageContainer: $('pageContainer'),
      pdfCanvas: $('pdfCanvas'), drawCanvas: $('drawCanvas'), annotationLayer: $('annotationLayer'),
      pageNav: $('pageNav'), prevPageBtn: $('prevPageBtn'), nextPageBtn: $('nextPageBtn'),
      pageInput: $('pageInput'), pageCount: $('pageCount'),
      fileInput: $('fileInput'),
      signModal: $('signModal'), signModalClose: $('signModalClose'),
      signCanvas: $('signCanvas'), clearSignBtn: $('clearSignBtn'),
      typeSignInput: $('typeSignInput'), typeSignPreview: $('typeSignPreview'),
      uploadSignInput: $('uploadSignInput'), uploadSignPreview: $('uploadSignPreview'),
      savedSignatures: $('savedSignatures'),
      saveSignCheck: $('saveSignCheck'), cancelSignBtn: $('cancelSignBtn'), applySignBtn: $('applySignBtn'),
      toastContainer: $('toastContainer'),
    };

    // ===================== Utility =====================
    let annotationIdCounter = 0;
    function genId() { return 'ann_' + (++annotationIdCounter) + '_' + Date.now(); }

    function getPageAnnotations(pageNum) {
      if (!state.annotations[pageNum]) {
        state.annotations[pageNum] = { texts: [], signatures: [], drawings: [] };
      }
      return state.annotations[pageNum];
    }

    function showToast(msg, isError = false) {
      const t = document.createElement('div');
      t.className = 'toast' + (isError ? ' error' : '');
      t.textContent = msg;
      els.toastContainer.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3000);
    }

    function enableTools(on) {
      const btns = [els.saveBtn, els.zoomInBtn, els.zoomOutBtn, els.selectTool, els.textTool, els.signTool, els.penTool, els.highlightTool, els.eraserTool, els.undoBtn];
      btns.forEach(b => b.disabled = !on);
    }

    // ===================== PDF Loading =====================
    async function openFile(file) {
      if (!file || file.type !== 'application/pdf') {
        showToast('Please select a valid PDF file.', true);
        return;
      }
      try {
        state.fileName = file.name;
        const arrayBuffer = await file.arrayBuffer();
        state.pdfBytes = new Uint8Array(arrayBuffer);
        state.pdfDoc = await pdfjsLib.getDocument({ data: state.pdfBytes.slice() }).promise;
        state.totalPages = state.pdfDoc.numPages;
        state.currentPage = 1;
        state.annotations = {};
        state.undoStack = [];

        els.dropZone.style.display = 'none';
        els.viewport.style.display = 'block';
        els.pageNav.style.display = 'flex';
        enableTools(true);

        els.pageCount.textContent = state.totalPages;
        els.pageInput.max = state.totalPages;

        await renderPage(state.currentPage);
        showToast(`Opened "${file.name}" — ${state.totalPages} page${state.totalPages > 1 ? 's' : ''}`);
      } catch(e) {
        console.error(e);
        showToast('Failed to open PDF: ' + e.message, true);
      }
    }

    // ===================== PDF Rendering =====================
    async function renderPage(pageNum) {
      if (state.rendering) return;
      state.rendering = true;
      try {
        const page = await state.pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: state.scale });
        state.pageWidth = viewport.width / state.scale;   // unscaled
        state.pageHeight = viewport.height / state.scale;

        const pdfCtx = els.pdfCanvas.getContext('2d');
        els.pdfCanvas.width = viewport.width;
        els.pdfCanvas.height = viewport.height;
        els.drawCanvas.width = viewport.width;
        els.drawCanvas.height = viewport.height;
        els.pageContainer.style.width = viewport.width + 'px';
        els.pageContainer.style.height = viewport.height + 'px';

        await page.render({ canvasContext: pdfCtx, viewport }).promise;

        renderAnnotations(pageNum);
        redrawStrokes(pageNum);
        updateNav();
        updateToolCursor();
      } catch(e) {
        console.error(e);
        showToast('Failed to render page.', true);
      }
      state.rendering = false;
    }

    // ===================== Annotation Rendering =====================
    function renderAnnotations(pageNum) {
      els.annotationLayer.innerHTML = '';
      const anns = getPageAnnotations(pageNum);

      anns.texts.forEach(t => createTextElement(t));
      anns.signatures.forEach(s => createSignatureElement(s));
    }

    function createTextElement(data) {
      const div = document.createElement('div');
      div.className = 'annotation text-annotation';
      div.dataset.id = data.id;
      div.style.left = (data.x * state.scale) + 'px';
      div.style.top = (data.y * state.scale) + 'px';

      const content = document.createElement('div');
      content.className = 'text-content';
      content.contentEditable = 'false'; // OFF by default — double-click to edit
      content.style.fontSize = (data.fontSize * state.scale) + 'px';
      content.style.color = data.color;
      content.textContent = data.text || '';

      // Double-click to enter edit mode
      content.addEventListener('dblclick', e => {
        e.stopPropagation();
        div.classList.add('editing');
        content.contentEditable = 'true';
        content.focus();
        // Select all text for easy replacement
        const range = document.createRange();
        range.selectNodeContents(content);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      });

      content.addEventListener('input', () => {
        data.text = content.textContent;
      });

      // Exit edit mode on blur
      content.addEventListener('blur', () => {
        data.text = content.textContent;
        content.contentEditable = 'false';
        div.classList.remove('editing');
        div.classList.remove('selected');
      });

      // Sync toolbar when entering edit mode
      content.addEventListener('focus', () => {
        state.activeTextId = data.id;
        els.fontSizePicker.value = data.fontSize;
        els.colorPicker.value = data.color;
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        removeAnnotation(data.id, 'texts');
      });

      div.appendChild(content);
      div.appendChild(delBtn);
      els.annotationLayer.appendChild(div);

      // Drag handling
      setupDrag(div, data);

      return div;
    }

    function createSignatureElement(data) {
      const div = document.createElement('div');
      div.className = 'annotation sig-annotation';
      div.dataset.id = data.id;
      div.style.left = (data.x * state.scale) + 'px';
      div.style.top = (data.y * state.scale) + 'px';
      div.style.width = (data.width * state.scale) + 'px';
      div.style.height = (data.height * state.scale) + 'px';

      const img = document.createElement('img');
      img.src = data.imgData;
      img.draggable = false;

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        removeAnnotation(data.id, 'signatures');
      });

      const resizeSE = document.createElement('div');
      resizeSE.className = 'resize-handle se';
      setupResize(resizeSE, div, data, 'se');

      const resizeSW = document.createElement('div');
      resizeSW.className = 'resize-handle sw';
      setupResize(resizeSW, div, data, 'sw');

      div.appendChild(img);
      div.appendChild(delBtn);
      div.appendChild(resizeSE);
      div.appendChild(resizeSW);
      els.annotationLayer.appendChild(div);

      setupDrag(div, data);

      return div;
    }

    function removeAnnotation(id, type) {
      const anns = getPageAnnotations(state.currentPage);
      const idx = anns[type].findIndex(a => a.id === id);
      if (idx !== -1) {
        const removed = anns[type].splice(idx, 1)[0];
        state.undoStack.push({ action: 'remove', type, data: removed, page: state.currentPage });
        renderAnnotations(state.currentPage);
      }
    }

    // ===================== Drag & Resize =====================
    function setupDrag(el, data) {
      let startX, startY, origX, origY, dragging = false;
      el.addEventListener('mousedown', e => {
        if (e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-btn')) return;
        // If this text annotation is in edit mode, let the browser handle it
        if (el.classList.contains('editing')) return;

        e.preventDefault();
        e.stopPropagation();
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        origX = data.x * state.scale;
        origY = data.y * state.scale;
        // Deselect all others, select this one
        els.annotationLayer.querySelectorAll('.annotation').forEach(a => a.classList.remove('selected'));
        el.classList.add('selected');
        // Sync toolbar pickers
        if (data.fontSize !== undefined) {
          state.activeTextId = data.id;
          els.fontSizePicker.value = data.fontSize;
        }
        if (data.color !== undefined) {
          els.colorPicker.value = data.color;
        }

        function onMove(e) {
          if (!dragging) return;
          const newLeft = origX + (e.clientX - startX);
          const newTop = origY + (e.clientY - startY);
          el.style.left = newLeft + 'px';
          el.style.top = newTop + 'px';
          data.x = newLeft / state.scale;
          data.y = newTop / state.scale;
        }
        function onUp() {
          dragging = false;
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    function setupResize(handle, el, data, corner) {
      handle.addEventListener('mousedown', e => {
        e.stopPropagation();
        e.preventDefault();
        const startX = e.clientX;
        const startY = e.clientY;
        const origW = data.width * state.scale;
        const origH = data.height * state.scale;
        const origLeft = data.x * state.scale;
        const aspect = origW / origH;

        function onMove(e) {
          let dx = e.clientX - startX;
          let dy = e.clientY - startY;
          let newW, newH;
          if (corner === 'se') {
            newW = Math.max(40, origW + dx);
            newH = newW / aspect;
          } else {
            newW = Math.max(40, origW - dx);
            newH = newW / aspect;
            el.style.left = (origLeft + (origW - newW)) + 'px';
            data.x = (origLeft + (origW - newW)) / state.scale;
          }
          el.style.width = newW + 'px';
          el.style.height = newH + 'px';
          data.width = newW / state.scale;
          data.height = newH / state.scale;
        }
        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    // ===================== Drawing System =====================
    function redrawStrokes(pageNum) {
      const ctx = els.drawCanvas.getContext('2d');
      ctx.clearRect(0, 0, els.drawCanvas.width, els.drawCanvas.height);
      const anns = getPageAnnotations(pageNum || state.currentPage);

      for (const stroke of anns.drawings) {
        drawStroke(ctx, stroke);
      }
    }

    function drawStroke(ctx, stroke) {
      if (stroke.points.length < 2) return;
      ctx.save();
      ctx.beginPath();
      ctx.strokeStyle = stroke.color;
      ctx.lineWidth = stroke.thickness * state.scale;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalAlpha = stroke.type === 'highlight' ? 0.35 : 1.0;

      ctx.moveTo(stroke.points[0].x * state.scale, stroke.points[0].y * state.scale);
      for (let i = 1; i < stroke.points.length; i++) {
        ctx.lineTo(stroke.points[i].x * state.scale, stroke.points[i].y * state.scale);
      }
      ctx.stroke();
      ctx.restore();
    }

    function getDrawPos(e) {
      const rect = els.drawCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) / state.scale,
        y: (e.clientY - rect.top) / state.scale
      };
    }

    function startStroke(e) {
      if (state.activeTool !== 'pen' && state.activeTool !== 'highlight' && state.activeTool !== 'eraser') return;
      e.preventDefault();
      state.isDrawing = true;
      const pos = getDrawPos(e);

      if (state.activeTool === 'eraser') {
        // Try to erase strokes near this point
        eraseAt(pos.x, pos.y);
        return;
      }

      state.currentStroke = {
        points: [pos],
        color: state.activeTool === 'highlight' ? els.colorPicker.value : els.colorPicker.value,
        thickness: parseInt(els.sizePicker.value),
        type: state.activeTool,
      };
      if (state.activeTool === 'highlight') {
        state.currentStroke.thickness = Math.max(parseInt(els.sizePicker.value) * 3, 12);
        state.currentStroke.color = els.colorPicker.value;
      }
    }

    function continueStroke(e) {
      if (!state.isDrawing) return;
      e.preventDefault();
      const pos = getDrawPos(e);

      if (state.activeTool === 'eraser') {
        eraseAt(pos.x, pos.y);
        return;
      }

      if (state.currentStroke) {
        state.currentStroke.points.push(pos);
        // Live draw
        const ctx = els.drawCanvas.getContext('2d');
        redrawStrokes(state.currentPage);
        drawStroke(ctx, state.currentStroke);
      }
    }

    function endStroke(e) {
      if (!state.isDrawing) return;
      state.isDrawing = false;
      if (state.currentStroke && state.currentStroke.points.length >= 2) {
        const anns = getPageAnnotations(state.currentPage);
        anns.drawings.push(state.currentStroke);
        state.undoStack.push({ action: 'add', type: 'drawings', data: state.currentStroke, page: state.currentPage });
        redrawStrokes(state.currentPage);
      }
      state.currentStroke = null;
    }

    function eraseAt(px, py) {
      const anns = getPageAnnotations(state.currentPage);
      const threshold = 15 / state.scale;
      for (let i = anns.drawings.length - 1; i >= 0; i--) {
        const stroke = anns.drawings[i];
        for (const pt of stroke.points) {
          const dx = px - pt.x, dy = py - pt.y;
          if (dx * dx + dy * dy < threshold * threshold) {
            const removed = anns.drawings.splice(i, 1)[0];
            state.undoStack.push({ action: 'erase', type: 'drawings', data: removed, page: state.currentPage });
            redrawStrokes(state.currentPage);
            return;
          }
        }
      }
    }

    // ===================== Tool Selection =====================
    function setTool(tool) {
      state.activeTool = tool;
      document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));

      const drawingTools = ['pen', 'highlight', 'eraser'];
      els.drawCanvas.style.pointerEvents = drawingTools.includes(tool) ? 'auto' : 'none';
      els.annotationLayer.style.pointerEvents = drawingTools.includes(tool) ? 'none' : 'auto';

      if (tool !== 'signature') {
        state.pendingSignature = null;
      }

      updateToolCursor();
    }

    function updateToolCursor() {
      const vp = els.viewport;
      vp.classList.remove('cursor-text', 'cursor-crosshair', 'cursor-pen', 'cursor-eraser', 'cursor-grab');
      switch (state.activeTool) {
        case 'text': vp.classList.add('cursor-text'); break;
        case 'signature': vp.classList.add('cursor-crosshair'); break;
        case 'pen': case 'highlight': vp.classList.add('cursor-pen'); break;
        case 'eraser': vp.classList.add('cursor-eraser'); break;
        default: vp.classList.add('cursor-grab');
      }
    }

    // ===================== Text Annotations =====================
    function handleViewportClick(e) {
      if (state.activeTool === 'text') {
        const rect = els.pageContainer.getBoundingClientRect();
        const x = (e.clientX - rect.left) / state.scale;
        const y = (e.clientY - rect.top) / state.scale;
        addTextAnnotation(x, y);
      } else if (state.activeTool === 'signature' && state.pendingSignature) {
        const rect = els.pageContainer.getBoundingClientRect();
        const x = (e.clientX - rect.left) / state.scale;
        const y = (e.clientY - rect.top) / state.scale;
        placeSignature(x, y);
      }
    }

    function addTextAnnotation(x, y) {
      const data = {
        id: genId(),
        x, y,
        text: '',
        fontSize: parseInt(els.fontSizePicker.value),
        color: els.colorPicker.value,
      };
      const anns = getPageAnnotations(state.currentPage);
      anns.texts.push(data);
      state.undoStack.push({ action: 'add', type: 'texts', data, page: state.currentPage });
      state.activeTextId = data.id;

      const el = createTextElement(data);
      const content = el.querySelector('.text-content');
      // Immediately enter edit mode for new text
      setTimeout(() => {
        el.classList.add('editing');
        content.contentEditable = 'true';
        content.focus();
      }, 50);
    }

    // ===================== Signature System =====================
    let signPadDrawing = false;
    let signPadCtx = null;
    let signPadPoints = [];

    function openSignatureModal() {
      els.signModal.classList.add('show');
      initSignPad();
      renderSavedSignatures();
    }

    function closeSignatureModal() {
      els.signModal.classList.remove('show');
    }

    function initSignPad() {
      const canvas = els.signCanvas;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = canvas.offsetWidth * 2;
      canvas.height = canvas.offsetHeight * 2;
      signPadCtx = canvas.getContext('2d');
      signPadCtx.scale(2, 2);
      signPadCtx.lineWidth = 2.5;
      signPadCtx.lineCap = 'round';
      signPadCtx.lineJoin = 'round';
      signPadCtx.strokeStyle = '#1a1a1a';
      signPadPoints = [];
      clearSignPad();
    }

    function clearSignPad() {
      if (!signPadCtx) return;
      signPadCtx.clearRect(0, 0, els.signCanvas.width, els.signCanvas.height);
      signPadPoints = [];
    }

    function signPadStart(e) {
      e.preventDefault();
      signPadDrawing = true;
      const pos = getSignPadPos(e);
      signPadPoints.push([pos]);
      signPadCtx.beginPath();
      signPadCtx.moveTo(pos.x, pos.y);
    }

    function signPadMove(e) {
      if (!signPadDrawing) return;
      e.preventDefault();
      const pos = getSignPadPos(e);
      signPadPoints[signPadPoints.length - 1].push(pos);
      signPadCtx.lineTo(pos.x, pos.y);
      signPadCtx.stroke();
      signPadCtx.beginPath();
      signPadCtx.moveTo(pos.x, pos.y);
    }

    function signPadEnd(e) {
      signPadDrawing = false;
    }

    function getSignPadPos(e) {
      const rect = els.signCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function getSignatureImage(source) {
      if (source === 'draw') {
        if (signPadPoints.length === 0) return null;
        // Crop drawn content
        const canvas = els.signCanvas;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const a = imgData.data[(y * canvas.width + x) * 4 + 3];
            if (a > 0) {
              minX = Math.min(minX, x); minY = Math.min(minY, y);
              maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
            }
          }
        }
        if (maxX <= minX || maxY <= minY) return null;
        const pad = 10;
        minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
        maxX = Math.min(canvas.width, maxX + pad); maxY = Math.min(canvas.height, maxY + pad);
        const w = maxX - minX, h = maxY - minY;
        const crop = document.createElement('canvas');
        crop.width = w; crop.height = h;
        crop.getContext('2d').drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
        return crop.toDataURL('image/png');
      } else if (source === 'type') {
        const text = els.typeSignInput.value.trim();
        if (!text) return null;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const fontSize = 48;
        ctx.font = `${fontSize}px 'Dancing Script', cursive`;
        const metrics = ctx.measureText(text);
        canvas.width = Math.ceil(metrics.width) + 20;
        canvas.height = fontSize + 20;
        ctx.font = `${fontSize}px 'Dancing Script', cursive`;
        ctx.fillStyle = '#1a1a1a';
        ctx.textBaseline = 'top';
        ctx.fillText(text, 10, 10);
        return canvas.toDataURL('image/png');
      } else if (source === 'upload') {
        const img = els.uploadSignPreview.querySelector('img');
        if (!img) return null;
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        return canvas.toDataURL('image/png');
      }
      return null;
    }

    function applySignature() {
      const activeTab = document.querySelector('.modal-tab.active').dataset.tab;
      let imgData = null;

      if (activeTab === 'saved') {
        const selected = els.savedSignatures.querySelector('.saved-sig-item.selected');
        if (selected) imgData = selected.dataset.imgData;
      } else {
        imgData = getSignatureImage(activeTab);
      }

      if (!imgData) {
        showToast('Please create or select a signature first.', true);
        return;
      }

      if (els.saveSignCheck.checked && activeTab !== 'saved') {
        state.savedSignatures.push(imgData);
        try { localStorage.setItem('pdfEditorSigs', JSON.stringify(state.savedSignatures)); } catch(e) {}
      }

      state.pendingSignature = imgData;
      closeSignatureModal();
      setTool('signature');
      showToast('Click on the page to place your signature');
    }

    function placeSignature(x, y) {
      if (!state.pendingSignature) return;
      const img = new Image();
      img.onload = () => {
        const maxW = 200;
        const ratio = img.height / img.width;
        const w = Math.min(maxW, img.width);
        const h = w * ratio;
        const data = {
          id: genId(),
          x: x - w / 2,
          y: y - h / 2,
          width: w,
          height: h,
          imgData: state.pendingSignature,
        };
        const anns = getPageAnnotations(state.currentPage);
        anns.signatures.push(data);
        state.undoStack.push({ action: 'add', type: 'signatures', data, page: state.currentPage });
        createSignatureElement(data);
        state.pendingSignature = null;
        setTool('select');
      };
      img.src = state.pendingSignature;
    }

    function renderSavedSignatures() {
      els.savedSignatures.innerHTML = '';
      if (state.savedSignatures.length === 0) {
        els.savedSignatures.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No saved signatures yet</div>';
        return;
      }
      state.savedSignatures.forEach((sig, i) => {
        const item = document.createElement('div');
        item.className = 'saved-sig-item';
        item.dataset.imgData = sig;
        item.innerHTML = `<img src="${sig}"><button class="remove-saved">×</button>`;
        item.addEventListener('click', () => {
          els.savedSignatures.querySelectorAll('.saved-sig-item').forEach(s => s.classList.remove('selected'));
          item.classList.add('selected');
        });
        item.querySelector('.remove-saved').addEventListener('click', e => {
          e.stopPropagation();
          state.savedSignatures.splice(i, 1);
          try { localStorage.setItem('pdfEditorSigs', JSON.stringify(state.savedSignatures)); } catch(e) {}
          renderSavedSignatures();
        });
        els.savedSignatures.appendChild(item);
      });
    }

    // ===================== Undo =====================
    function undo() {
      if (state.undoStack.length === 0) return;
      const entry = state.undoStack.pop();
      const anns = getPageAnnotations(entry.page);

      if (entry.action === 'add') {
        const idx = anns[entry.type].findIndex(a => a.id === entry.data.id || a === entry.data);
        if (idx !== -1) anns[entry.type].splice(idx, 1);
      } else if (entry.action === 'remove' || entry.action === 'erase') {
        anns[entry.type].push(entry.data);
      }

      if (entry.page === state.currentPage) {
        renderAnnotations(state.currentPage);
        redrawStrokes(state.currentPage);
      }
      showToast('Undo');
    }

    // ===================== Navigation =====================
    function goToPage(num) {
      num = Math.max(1, Math.min(num, state.totalPages));
      if (num === state.currentPage && !state.rendering) return;
      state.currentPage = num;
      renderPage(num);
    }

    function updateNav() {
      els.pageInput.value = state.currentPage;
      els.prevPageBtn.disabled = state.currentPage <= 1;
      els.nextPageBtn.disabled = state.currentPage >= state.totalPages;
    }

    // ===================== Zoom =====================
    const ZOOM_LEVELS = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0];

    function setZoom(scale) {
      state.scale = Math.max(0.25, Math.min(5, scale));
      els.zoomDisplay.textContent = Math.round(state.scale * 100) + '%';
      if (state.pdfDoc) renderPage(state.currentPage);
    }

    function zoomIn() {
      const next = ZOOM_LEVELS.find(z => z > state.scale + 0.01);
      setZoom(next || Math.min(state.scale + 0.25, 5));
    }

    function zoomOut() {
      const prev = [...ZOOM_LEVELS].reverse().find(z => z < state.scale - 0.01);
      setZoom(prev || Math.max(state.scale - 0.25, 0.25));
    }

    // ===================== Theme =====================
    function toggleTheme() {
      state.isDarkMode = !state.isDarkMode;
      document.documentElement.dataset.theme = state.isDarkMode ? 'dark' : 'light';
      els.themeIcon.innerHTML = state.isDarkMode
        ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
        : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
    }

    // ===================== Export / Save PDF =====================
    async function savePDF() {
      if (!state.pdfBytes) return;
      try {
        showToast('Saving PDF...');
        // Always load a fresh copy of the original — never use a mutated/cached version
        const pdfDoc = await PDFLib.PDFDocument.load(state.pdfBytes.slice());
        const pages = pdfDoc.getPages();

        for (let pageNum = 1; pageNum <= state.totalPages; pageNum++) {
          const anns = state.annotations[pageNum];
          if (!anns) continue;
          const page = pages[pageNum - 1];
          const { width: pW, height: pH } = page.getSize();
          const scaleX = pW / state.pageWidth;
          const scaleY = pH / state.pageHeight;

          // Embed text annotations
          const helvetica = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
          for (const t of anns.texts) {
            if (!t.text || !t.text.trim()) continue;
            const fontSize = t.fontSize * scaleY;
            const x = t.x * scaleX;
            const y = pH - (t.y * scaleY) - fontSize;
            // Parse hex color
            const hex = t.color.replace('#', '');
            const r = parseInt(hex.substr(0,2),16)/255;
            const g = parseInt(hex.substr(2,2),16)/255;
            const b = parseInt(hex.substr(4,2),16)/255;
            page.drawText(t.text, {
              x, y, size: fontSize,
              font: helvetica,
              color: PDFLib.rgb(r, g, b),
            });
          }

          // Embed signatures
          for (const s of anns.signatures) {
            try {
              const imgBytes = dataUrlToUint8Array(s.imgData);
              let embeddedImg;
              if (s.imgData.includes('image/png')) {
                embeddedImg = await pdfDoc.embedPng(imgBytes);
              } else {
                embeddedImg = await pdfDoc.embedJpg(imgBytes);
              }
              const x = s.x * scaleX;
              const y = pH - (s.y * scaleY) - (s.height * scaleY);
              page.drawImage(embeddedImg, {
                x, y,
                width: s.width * scaleX,
                height: s.height * scaleY,
              });
            } catch(e) { console.warn('Failed to embed signature:', e); }
          }

          // Embed drawings as overlay image
          if (anns.drawings.length > 0) {
            const drawCanvas = document.createElement('canvas');
            // Render at PDF resolution
            drawCanvas.width = pW * 2;
            drawCanvas.height = pH * 2;
            const dCtx = drawCanvas.getContext('2d');
            dCtx.scale(2, 2);

            for (const stroke of anns.drawings) {
              if (stroke.points.length < 2) continue;
              dCtx.save();
              dCtx.beginPath();
              dCtx.strokeStyle = stroke.color;
              dCtx.lineWidth = stroke.thickness * scaleX;
              dCtx.lineCap = 'round';
              dCtx.lineJoin = 'round';
              dCtx.globalAlpha = stroke.type === 'highlight' ? 0.35 : 1.0;
              dCtx.moveTo(stroke.points[0].x * scaleX, stroke.points[0].y * scaleY);
              for (let i = 1; i < stroke.points.length; i++) {
                dCtx.lineTo(stroke.points[i].x * scaleX, stroke.points[i].y * scaleY);
              }
              dCtx.stroke();
              dCtx.restore();
            }

            const drawPng = dataUrlToUint8Array(drawCanvas.toDataURL('image/png'));
            const drawImg = await pdfDoc.embedPng(drawPng);
            page.drawImage(drawImg, { x: 0, y: 0, width: pW, height: pH });
          }
        }

        const savedBytes = await pdfDoc.save();
        const blob = new Blob([savedBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = state.fileName.replace(/\.pdf$/i, '_edited.pdf');
        a.click();
        URL.revokeObjectURL(url);
        showToast('PDF saved successfully!');
      } catch(e) {
        console.error(e);
        showToast('Failed to save PDF: ' + e.message, true);
      }
    }

    function dataUrlToUint8Array(dataUrl) {
      const base64 = dataUrl.split(',')[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    // ===================== Event Listeners =====================

    // File Open
    els.openBtn.addEventListener('click', () => els.fileInput.click());
    els.browseBtn.addEventListener('click', () => els.fileInput.click());
    els.fileInput.addEventListener('change', e => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ''; });

    // Drag and drop
    els.dropArea.addEventListener('dragover', e => { e.preventDefault(); els.dropArea.classList.add('drag-over'); });
    els.dropArea.addEventListener('dragleave', () => els.dropArea.classList.remove('drag-over'));
    els.dropArea.addEventListener('drop', e => { e.preventDefault(); els.dropArea.classList.remove('drag-over'); if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });
    // Also allow drop on viewport
    els.viewport.addEventListener('dragover', e => e.preventDefault());
    els.viewport.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });

    // Save
    els.saveBtn.addEventListener('click', savePDF);

    // Zoom
    els.zoomInBtn.addEventListener('click', zoomIn);
    els.zoomOutBtn.addEventListener('click', zoomOut);
    els.viewport.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        if (e.deltaY < 0) zoomIn(); else zoomOut();
      }
    }, { passive: false });

    // Tools
    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.tool === 'signature') {
          openSignatureModal();
        } else {
          setTool(btn.dataset.tool);
        }
      });
    });

    // Undo
    els.undoBtn.addEventListener('click', undo);

    // Theme
    els.themeBtn.addEventListener('click', toggleTheme);

    // Page navigation
    els.prevPageBtn.addEventListener('click', () => goToPage(state.currentPage - 1));
    els.nextPageBtn.addEventListener('click', () => goToPage(state.currentPage + 1));
    els.pageInput.addEventListener('change', () => goToPage(parseInt(els.pageInput.value) || 1));

    // Viewport click (text & signature placement)
    els.annotationLayer.addEventListener('click', e => {
      if (e.target === els.annotationLayer) {
        // Clicked empty space — deselect all annotations
        els.annotationLayer.querySelectorAll('.annotation').forEach(a => a.classList.remove('selected'));
        state.activeTextId = null;
        handleViewportClick(e);
      }
    });

    // Drawing events
    els.drawCanvas.addEventListener('mousedown', startStroke);
    els.drawCanvas.addEventListener('mousemove', continueStroke);
    els.drawCanvas.addEventListener('mouseup', endStroke);
    els.drawCanvas.addEventListener('mouseleave', endStroke);
    // Touch support for drawing
    els.drawCanvas.addEventListener('touchstart', e => { const t = e.touches[0]; startStroke({ clientX: t.clientX, clientY: t.clientY, preventDefault: () => e.preventDefault() }); }, { passive: false });
    els.drawCanvas.addEventListener('touchmove', e => { const t = e.touches[0]; continueStroke({ clientX: t.clientX, clientY: t.clientY, preventDefault: () => e.preventDefault() }); }, { passive: false });
    els.drawCanvas.addEventListener('touchend', e => endStroke(e));

    // Signature modal
    els.signModalClose.addEventListener('click', closeSignatureModal);
    els.cancelSignBtn.addEventListener('click', closeSignatureModal);
    els.applySignBtn.addEventListener('click', applySignature);
    els.clearSignBtn.addEventListener('click', clearSignPad);
    els.signModal.addEventListener('click', e => { if (e.target === els.signModal) closeSignatureModal(); });

    // Signature pad drawing
    els.signCanvas.addEventListener('mousedown', signPadStart);
    els.signCanvas.addEventListener('mousemove', signPadMove);
    els.signCanvas.addEventListener('mouseup', signPadEnd);
    els.signCanvas.addEventListener('mouseleave', signPadEnd);
    els.signCanvas.addEventListener('touchstart', signPadStart, { passive: false });
    els.signCanvas.addEventListener('touchmove', signPadMove, { passive: false });
    els.signCanvas.addEventListener('touchend', signPadEnd);

    // Signature modal tabs
    document.querySelectorAll('.modal-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Panel').classList.add('active');
        if (tab.dataset.tab === 'draw') initSignPad();
        if (tab.dataset.tab === 'saved') renderSavedSignatures();
      });
    });

    // Font size picker — update active text annotation live
    els.fontSizePicker.addEventListener('change', () => {
      const newSize = parseInt(els.fontSizePicker.value);
      if (!state.activeTextId) return;
      const anns = getPageAnnotations(state.currentPage);
      const data = anns.texts.find(t => t.id === state.activeTextId);
      if (data) {
        data.fontSize = newSize;
        const el = els.annotationLayer.querySelector(`[data-id="${state.activeTextId}"]`);
        if (el) el.querySelector('.text-content').style.fontSize = (newSize * state.scale) + 'px';
      }
    });

    // Color picker — update active text annotation live
    els.colorPicker.addEventListener('input', () => {
      const newColor = els.colorPicker.value;
      if (!state.activeTextId) return;
      const anns = getPageAnnotations(state.currentPage);
      const data = anns.texts.find(t => t.id === state.activeTextId);
      if (data) {
        data.color = newColor;
        const el = els.annotationLayer.querySelector(`[data-id="${state.activeTextId}"]`);
        if (el) el.querySelector('.text-content').style.color = newColor;
      }
    });

    // Type signature preview
    els.typeSignInput.addEventListener('input', () => {
      els.typeSignPreview.textContent = els.typeSignInput.value || '';
    });

    // Upload signature
    els.uploadSignInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        els.uploadSignPreview.innerHTML = `<img src="${reader.result}">`;
      };
      reader.readAsDataURL(file);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.contentEditable === 'true') return;

      if ((e.ctrlKey || e.metaKey) && e.key === 'o') { e.preventDefault(); els.fileInput.click(); }
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); savePDF(); }
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
      if (e.key === 'v' || e.key === 'V') setTool('select');
      if (e.key === 't' || e.key === 'T') setTool('text');
      if (e.key === 's' && !e.ctrlKey && !e.metaKey) openSignatureModal();
      if (e.key === 'p' || e.key === 'P') setTool('pen');
      if (e.key === 'h' || e.key === 'H') setTool('highlight');
      if (e.key === 'e' || e.key === 'E') setTool('eraser');
      if (e.key === 'ArrowLeft') { e.preventDefault(); goToPage(state.currentPage - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); goToPage(state.currentPage + 1); }
      if (e.key === 'Delete' || e.key === 'Backspace') {
        const selected = els.annotationLayer.querySelector('.selected');
        if (selected) {
          const id = selected.dataset.id;
          const anns = getPageAnnotations(state.currentPage);
          const type = selected.classList.contains('sig-annotation') ? 'signatures' : 'texts';
          removeAnnotation(id, type);
        }
      }
      if (e.key === '=' || e.key === '+') { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomIn(); } }
      if (e.key === '-') { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomOut(); } }
    });

    // Init zoom display
    els.zoomDisplay.textContent = Math.round(state.scale * 100) + '%';

  })();
  </script>
</body>
</html>
